<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Shubham Joshi. Applied AI, Data Science, AI Product. Four systems: Govern with AgentDock, Explain with RxCheck, Assist with Nimbus, Create with FridgeChef.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#122036"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="940" height="310" rx="18" fill="url(#bg)"/>
  <g stroke="#1a2b49" stroke-width="1">
    <path d="M0 250 H940" opacity="0.6"/>
    <path d="M0 170 H940" opacity="0.4"/>
    <path d="M120 0 V310" opacity="0.3"/>
    <path d="M470 0 V310" opacity="0.3"/>
    <path d="M820 0 V310" opacity="0.3"/>
  </g>
  <text x="470" y="74" text-anchor="middle" fill="#f4f7fd" font-size="36" font-weight="700" letter-spacing="7">SHUBHAM JOSHI</text>
  <text x="470" y="104" text-anchor="middle" fill="#8da3c9" font-size="14" letter-spacing="4">APPLIED AI &#183; DATA SCIENCE &#183; AI PRODUCT</text>
  <text x="470" y="132" text-anchor="middle" fill="#c8d4ea" font-size="14" font-style="italic">&#8220;I build AI systems people can understand, control, evaluate, and actually use.&#8221;</text>
  <path d="M170 218 H770" stroke="#2b3d63" stroke-width="2"/>
  <circle r="4.5" fill="#5fd4e6">
    <animateMotion dur="7s" repeatCount="indefinite" path="M170 218 H770"/>
  </circle>

  <g text-anchor="middle">
    <circle cx="170" cy="218" r="34" fill="url(#pulse)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="218" r="17" fill="#16233d" stroke="#ffb454" stroke-width="2"/>
    <circle cx="170" cy="218" r="5" fill="#ffb454"/>
    <text x="170" y="186" fill="#ffb454" font-size="12" font-weight="700" letter-spacing="3">GOVERN</text>
    <text x="170" y="261" fill="#e8eefb" font-size="14" font-weight="600">AgentDock</text>
    <text x="170" y="279" fill="#7d92b8" font-size="11">multi-agent control plane</text>
  </g>

  <g text-anchor="middle">
    <circle cx="370" cy="218" r="34" fill="url(#pulse)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="218" r="17" fill="#16233d" stroke="#ffb454" stroke-width="2"/>
    <circle cx="370" cy="218" r="5" fill="#ffb454"/>
    <text x="370" y="186" fill="#ffb454" font-size="12" font-weight="700" letter-spacing="3">EXPLAIN</text>
    <text x="370" y="261" fill="#e8eefb" font-size="14" font-weight="600">RxCheck</text>
    <text x="370" y="279" fill="#7d92b8" font-size="11">clinical decision support</text>
  </g>

  <g text-anchor="middle">
    <circle cx="570" cy="218" r="34" fill="url(#pulse)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="570" cy="218" r="17" fill="#16233d" stroke="#ffb454" stroke-width="2"/>
    <circle cx="570" cy="218" r="5" fill="#ffb454"/>
    <text x="570" y="186" fill="#ffb454" font-size="12" font-weight="700" letter-spacing="3">ASSIST</text>
    <text x="570" y="261" fill="#e8eefb" font-size="14" font-weight="600">Nimbus</text>
    <text x="570" y="279" fill="#7d92b8" font-size="11">burnout companion</text>
  </g>

  <g text-anchor="middle">
    <circle cx="770" cy="218" r="34" fill="url(#pulse)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="218" r="17" fill="#16233d" stroke="#ffb454" stroke-width="2"/>
    <circle cx="770" cy="218" r="5" fill="#ffb454"/>
    <text x="770" y="186" fill="#ffb454" font-size="12" font-weight="700" letter-spacing="3">CREATE</text>
    <text x="770" y="261" fill="#e8eefb" font-size="14" font-weight="600">FridgeChef</text>
    <text x="770" y="279" fill="#7d92b8" font-size="11">consumer AI product</text>
  </g>
</svg>
